name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install certifi pillow pyinstaller

      - name: 打包引擎
        run: |
          pyinstaller --onefile --windowed --name 长征引擎 --add-data "web;web" --runtime-tmpdir run backend.py

      - name: 整理发布包
        run: |
          mkdir out
          copy "dist\长征引擎.exe" out\
          copy icon.ico out\
          xcopy /E /I web out\web
          xcopy /E /I electron out\electron
          del out\electron\node_modules /Q 2>nul
          copy README.md out\

      - uses: actions/upload-artifact@v4
        with:
          name: changzheng-launcher
          path: out
